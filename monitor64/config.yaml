name: Monitor64
version: "0.1.11-2"
slug: monitor64
description: Monitor64-Agent (6465), read-only Docker-Proxy (2376) und Home-Assistant-Checks
arch:
  - amd64
  - aarch64
  - armv7
startup: system
boot: auto
host_pid: true
host_network: true
host_dbus: true
full_access: true
privileged:
  - SYS_RAWIO
  - SYS_ADMIN
docker_api: true
map:
  - config:ro
options:
  keys: []
  local_scripts: false
  listen: ":2376"
  docker_socket: "/var/run/docker.sock"
  agent_port: 6465
  agent_root: ""
  enable_checks: true
  enable_api: true
  enable_backup_last: true
  enable_backup_state: true
  enable_db: true
  enable_updates: true
  enable_integrations: true
  watch_entities: []
  ignore_integrations: []
  entity_backup_last: sensor.backup_letztes_erfolgreiches_automatisches_backup
  entity_backup_state: sensor.backup_backup_manager_zustand
  entity_db_size: sensor.db_size
  backup_warn_h: 48
  backup_crit_h: 96
  db_warn_gb: 8
  db_crit_gb: 12
schema:
  keys:
    - str
  local_scripts: bool
  listen: str
  docker_socket: str
  agent_port: int
  agent_root: str
  enable_checks: bool
  enable_api: bool
  enable_backup_last: bool
  enable_backup_state: bool
  enable_db: bool
  enable_updates: bool
  enable_integrations: bool
  watch_entities:
    - str
  ignore_integrations:
    - str
  entity_backup_last: str
  entity_backup_state: str
  entity_db_size: str
  backup_warn_h: int(1,8760)
  backup_crit_h: int(1,8760)
  db_warn_gb: float(0.1,1000)
  db_crit_gb: float(0.1,1000)
